version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kicaugo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kicaugo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kicaugo}
      POSTGRES_DB: ${POSTGRES_DB:-kicaugo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5462:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kicaugo} -d ${POSTGRES_DB:-kicaugo}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kicaugo-net
    restart: unless-stopped

  api:
    image: ghcr.io/junx27/kicaugo-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kicaugo-api
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-kicaugo}:${POSTGRES_PASSWORD:-kicaugo}@postgres:5432/${POSTGRES_DB:-kicaugo}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      DOCS_USER: ${DOCS_USER:-admin}
      DOCS_PASS: ${DOCS_PASS:-changeme}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL:-https://api.weatherapi.com/v1}
      WEATHER_API_LANG: ${WEATHER_API_LANG:-id}
      CARTO_BASEMAP_KEY: "${CARTO_BASEMAP_KEY:-}"
      CARTO_BASEMAP_URL: "${CARTO_BASEMAP_URL:-}"
      CARTO_TILE_CACHE_TTL: "${CARTO_TILE_CACHE_TTL:-168h}"
      CARTO_TILE_CACHE_MAX_ENTRIES: "${CARTO_TILE_CACHE_MAX_ENTRIES:-20000}"
      CARTO_TILE_RATE_PER_MIN: "${CARTO_TILE_RATE_PER_MIN:-300}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kicaugo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

networks:
  kicaugo-net:
    driver: bridge
