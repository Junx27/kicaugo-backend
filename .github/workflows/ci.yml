name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.27"
  DATABASE_URL: postgres://kicaugo@localhost:5432/kicaugo?sslmode=disable
  TEST_DATABASE_URL: postgres://kicaugo@localhost:5432/kicaugo?sslmode=disable
  JWT_SECRET: ci-jwt-secret-min-32-chars-for-tests-only
  CARTO_BASEMAP_KEY: ""
  CARTO_BASEMAP_URL: https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png
  CARTO_TILE_CACHE_TTL: 168h
  CARTO_TILE_CACHE_MAX_ENTRIES: "20000"
  CARTO_TILE_RATE_PER_MIN: "300"

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kicaugo
          POSTGRES_DB: kicaugo
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kicaugo -d kicaugo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Prepare test database
        run: |
          for file in internal/database/migrations/*.sql internal/database/indexes/*.sql internal/database/seeders/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build
        run: go build ./...

      - name: Convert coverage to LCOV
        if: github.event_name == 'pull_request'
        run: go run github.com/jandelgado/gcov2lcov@latest -infile=coverage.out -outfile=coverage.lcov

      - name: Check changed-lines coverage (100%)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install --quiet --only-binary :all: diff-cover==11.0.4
          git fetch origin ${{ github.base_ref }} --depth=1
          diff-cover coverage.lcov --compare-branch=origin/${{ github.base_ref }} --fail-under=100

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Build image
        run: docker build -t kicaugo-backend:ci .